name: tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { laravel: 8,  php: '8.0', testbench: '^6.0', allow_insecure: true }
          - { laravel: 8,  php: '8.1', testbench: '^6.0', allow_insecure: true }
          - { laravel: 9,  php: '8.0', testbench: '^7.0', allow_insecure: true }
          - { laravel: 9,  php: '8.2', testbench: '^7.0', allow_insecure: true }
          - { laravel: 10, php: '8.1', testbench: '^8.0', allow_insecure: true }
          - { laravel: 10, php: '8.3', testbench: '^8.0', allow_insecure: true }
          - { laravel: 11, php: '8.2', testbench: '^9.0', allow_insecure: true }
          - { laravel: 11, php: '8.4', testbench: '^9.0', allow_insecure: true }
          - { laravel: 12, php: '8.3', testbench: '^10.0' }
          - { laravel: 13, php: '8.3', testbench: '^11.0' }

    name: L${{ matrix.laravel }} / PHP ${{ matrix.php }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Install dependencies
        run: |
          # Laravel 8–11 are EOL and have published advisories; only those legs opt out of blocking
          if [ "${{ matrix.allow_insecure }}" = "true" ]; then composer config audit.block-insecure false; fi
          composer require --dev "orchestra/testbench:${{ matrix.testbench }}" "phpunit/phpunit:^9.5|^10|^11|^12" --no-interaction --no-update
          composer require "illuminate/support:^${{ matrix.laravel }}.0" "illuminate/http:^${{ matrix.laravel }}.0" "illuminate/routing:^${{ matrix.laravel }}.0" "illuminate/session:^${{ matrix.laravel }}.0" --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/phpunit
